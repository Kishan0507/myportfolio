services:
  # ----------------------------------------
  # 1. Django Backend Web Service
  # ----------------------------------------
  - type: web
    name: myportfolio-backend
    runtime: python
    plan: free
    rootDir: config
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*" # Temporarily allows all until you configure your specific Render URL
      - key: CORS_ALLOWED_ORIGINS
        value: "https://myportfolio-frontend.onrender.com" # Change to your actual frontend URL once generated

  # ----------------------------------------
  # 2. React (Vite) Frontend Static Site
  # ----------------------------------------
  - type: web
    name: myportfolio-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "18.16.0"
      - key: VITE_API_URL
        value: "https://myportfolio-backend.onrender.com/api/" # Change to your actual backend URL once generated
